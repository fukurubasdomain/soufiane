<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>soufiane Social links</title>
<link rel="stylesheet" href="style.css">
<style>
  :root{
    --ink: #090610;
    --ink-2: #181022;
    --line: #443254;
    --fog: #b3a2c8;
    --paper: #e9e0f2;
    --signal: #b38bdc;
  }

  html,body{
    margin:0;
    padding:0;
    background: var(--ink);
    color: var(--paper);
    min-height:100svh;
    font-family: 'IBM Plex Mono','SFMono-Regular',Consolas,Menlo,monospace;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 20px;
    position: relative;
    overflow-x: hidden;
    background-color: var(--ink);
  }

  .ink-bg{
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
    background-image: url('assets/social-purple-hands.png');
    background-size: cover;
    background-position: center;
  }

  .ink-bg::after{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(ellipse at 50% 35%, rgba(20,10,36,0.08) 0%, rgba(16,8,29,0.35) 70%, rgba(10,6,20,0.72) 100%);
  }

  .scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.015) 0px,
      rgba(255,255,255,0.015) 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }

  .card{
    width:100%;
    max-width: 420px;
    position:relative;
    z-index:1;
    padding: 28px 24px;
    background: rgba(14,9,24,0.92);
    backdrop-filter: blur(6px);
    border-radius: 14px;
    border: 1px solid rgba(179,139,220,0.3);
  }

  .profile{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .prompt-line{
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--fog);
    font-size: 13px;
    letter-spacing: 0.04em;
    margin-bottom: 18px;
  }

  .dot{
    width:6px; height:6px;
    border-radius:50%;
    background: var(--signal);
    box-shadow: 0 0 8px var(--signal);
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }

  .avatar{
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: var(--ink-2);
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom: 24px;
    box-shadow: 0 0 0 4px rgba(179,139,220,0.14);
  }

  .avatar img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  h1{
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: clamp(28px, 7vw, 38px);
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 6px 0;
    color: var(--paper);
    min-height: 1.2em;
  }

  .cursor{
    display:inline-block;
    width: 3px;
    height: 0.9em;
    background: var(--signal);
    margin-left: 4px;
    vertical-align: -0.1em;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink{
    0%,49%{ opacity:1; }
    50%,100%{ opacity:0; }
  }

  .tagline{
    color: var(--fog);
    font-size: 14px;
    margin: 0 0 36px 0;
    line-height: 1.6;
  }

  .tagline span{ color: var(--signal); }

  .links{
    display:flex;
    flex-direction: column;
    gap: 12px;
  }

  .link{
    display:flex;
    align-items:center;
    gap: 14px;
    padding: 16px 18px;
    background: var(--ink-2);
    border: 1px solid var(--line);
    border-radius: 10px;
    text-decoration:none;
    color: var(--paper);
    font-family: system-ui, sans-serif;
    font-size: 15px;
    font-weight: 500;
    position:relative;
    overflow:hidden;
    transition: border-color 0.25s ease, transform 0.15s ease, background 0.25s ease;
  }

  .link::before{
    content:"";
    position:absolute;
    left:0; top:0; bottom:0;
    width: 2px;
    background: var(--signal);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.25s ease;
  }

  .link:hover{
    border-color: rgba(179,139,220,0.65);
    background: #251831;
    transform: translateX(3px);
  }

  .link:hover::before{
    transform: scaleY(1);
  }

  .link:active{
    transform: translateX(3px) scale(0.99);
  }

  .icon{
    width: 20px;
    height: 20px;
    flex-shrink:0;
    color: var(--fog);
    transition: color 0.25s ease;
  }

  .link:hover .icon{ color: var(--signal); }

  .label{ flex:1; min-width:0; }

  .handle-sub{
    font-size: 12px;
    color: var(--fog);
    font-weight: 400;
    display:block;
    margin-top: 2px;
  }

  .arrow{
    color: var(--fog);
    font-size: 14px;
    transition: color 0.25s ease, transform 0.25s ease;
  }

  .link:hover .arrow{
    color: var(--signal);
    transform: translateX(2px);
  }

  footer{
    margin-top: 32px;
    text-align:center;
    font-size: 11px;
    color: var(--line);
    letter-spacing: 0.06em;
  }

  .link:focus-visible{
    outline: 2px solid var(--signal);
    outline-offset: 4px;
  }

  @media (prefers-reduced-motion: reduce){
    .dot, .cursor { animation: none; }
  }
</style>

</head>
<body>
<button id="return-to-choice" type="button" onclick="returnToChoice()">← Back to home</button>

<div class="ink-bg"></div>

<div class="scanlines"></div>

<div class="card">
  <div class="avatar"><img id="discord-avatar" alt="" style="visibility:hidden"></div>

  <h1 id="handle">soufiane<span class="cursor"></span></h1>
  <p class="tagline">Find me online. Choose a <span>link</span> below.</p>

  <div class="links">

    <a class="link" href="https://www.instagram.com/tinycareless/" target="_blank" rel="noopener noreferrer">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <rect x="3" y="3" width="18" height="18" rx="5"/>
        <circle cx="12" cy="12" r="4"/>
        <circle cx="17.2" cy="6.8" r="1"/>
      </svg>
      <span class="label">Instagram<span class="handle-sub">@tinycareless</span></span>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="link" href="https://www.tiktok.com/@un.held" target="_blank" rel="noopener noreferrer">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M14 3v10.5a3.5 3.5 0 1 1-3-3.46"/>
        <path d="M14 3c0 2.5 2 4.5 4.5 4.5"/>
      </svg>
      <span class="label">TikTok<span class="handle-sub">@un.held</span></span>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="link" href="https://open.spotify.com/user/31sip7pe6jlshwfsoxzi35c4674e?si=42b858c847834cca" target="_blank" rel="noopener noreferrer">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="9"/>
        <path d="M7.5 10.2c3-1 6.7-.6 9.2.9"/>
        <path d="M8 13.3c2.4-.7 5.3-.4 7.3.8"/>
        <path d="M8.5 16.2c1.8-.5 4-.3 5.5.6"/>
      </svg>
      <span class="label">Spotify<span class="handle-sub">Follow me on Spotify</span></span>
      <span class="arrow">&rarr;</span>
    </a>



  </div>

</div>

<script>
  // decode-in animation for the handle
  const el = document.getElementById('handle');
  const cursor = el.querySelector('.cursor');
  let finalText = "soufiane";
  const chars = "abcdefghijklmnopqrstuvwxyz_0123456789";
  let frame = 0;
  const totalFrames = 18;

  function setDiscordDisplayName(name) {
    if (finalText === name) return;
    finalText = name;
    // Finish the initial scramble so it cannot overwrite the live name.
    frame = totalFrames;
    el.textContent = finalText;
    el.appendChild(cursor);
  }

  function scramble(){
    if(frame >= totalFrames){
      el.textContent = finalText;
      el.appendChild(cursor);
      return;
    }
    const progress = frame / totalFrames;
    const revealCount = Math.floor(progress * finalText.length);
    let out = "";
    for(let i=0;i<finalText.length;i++){
      if(i < revealCount || finalText[i] === "_" && i < revealCount + 1){
        out += finalText[i];
      } else {
        out += chars[Math.floor(Math.random()*chars.length)];
      }
    }
    el.textContent = out;
    frame++;
    requestAnimationFrame(() => setTimeout(scramble, 35));
  }

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    el.textContent = finalText;
    el.appendChild(cursor);
  } else {
    scramble();
  }
</script>



<script src="script.js"></script>
<script>
  (() => {
    const userId = '1092550069061947413'; // Same Discord account as Watchly.
    const avatar = document.getElementById('discord-avatar');
    let timer;
    let request;

    avatar.addEventListener('error', () => {
      avatar.style.visibility = 'hidden';
      avatar.removeAttribute('src');
    });
    avatar.addEventListener('load', () => { avatar.style.visibility = 'visible'; });

    async function refreshAvatar() {
      if (document.hidden || request) return;
      const controller = new AbortController();
      request = controller;
      const timeout = setTimeout(() => controller.abort(), 10000);
      try {
        const response = await fetch(`https://api.lanyard.rest/v1/users/${userId}`, {
          signal: controller.signal,
          cache: 'no-store'
        });
        if (!response.ok) return;
        const result = await response.json();
        const user = result.success && result.data && result.data.discord_user;
        if (!user || controller.signal.aborted) return;
        const displayName = user.global_name || user.username;
        if (displayName) {
          setDiscordDisplayName(displayName);
          avatar.alt = displayName;
        }
        let url;
        if (user.avatar) {
          const extension = user.avatar.startsWith('a_') ? 'gif' : 'png';
          url = `https://cdn.discordapp.com/avatars/${userId}/${user.avatar}.${extension}?size=128`;
        } else {
          const index = Number(user.discriminator)
            ? Number(user.discriminator) % 5
            : Number((BigInt(userId) >> 22n) % 6n);
          url = `https://cdn.discordapp.com/embed/avatars/${index}.png`;
        }
        if (avatar.getAttribute('src') !== url) avatar.src = url;
      } catch (_) {
        // Keep the current picture when Discord/Lanyard is unavailable.
      } finally {
        clearTimeout(timeout);
        if (request === controller) request = null;
      }
    }

    function stop() {
      clearInterval(timer);
      if (request) request.abort();
      request = null;
    }
    function start() {
      stop();
      if (document.hidden) return;
      refreshAvatar();
      timer = setInterval(refreshAvatar, 60000);
    }
    document.addEventListener('visibilitychange', start);
    window.addEventListener('pagehide', stop);
    window.addEventListener('pageshow', start);
    start();
  })();
</script>
</body>
</html>
